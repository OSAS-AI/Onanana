    description: "Too Many Requests - rate limit exceeded, key will be locked"
    action: lock_key
  403:
    description: "Forbidden - access denied, key may be invalid or revoked"
    action: lock_key
  
  500:
    description: "Internal Server Error - temporary server failure"
    action: lock_key

  502:
    description: "Internal Server Error - temporary server failure"
    action: lock_key

  503:
    description: "Internal Server Error - temporary server failure"
    action: lock_key
  
  504:
    description: "Internal Server Error - temporary server failure"
    action: lock_key
    
  524:
